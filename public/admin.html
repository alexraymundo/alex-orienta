<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex Orienta | Panel</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><aside><div class="brand">ALEX <span>ORIENTA</span></div><button data-tab="dash" class="active">Hoy</button><button data-tab="agenda">Agenda</button><button data-tab="people">Personas</button><button data-tab="voc">Mapa vocacional</button><button data-tab="ai">Reflexión AI</button><button id="logout">Cerrar sesión</button></aside><main><section id="login"><div class="login"><h1>Panel privado</h1><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">ENTRAR</button><div id="loginStatus"></div></div></section><div id="app" hidden><section id="view-dash" class="view active"><h1>Hoy</h1><div class="stats"><article>Solicitudes<strong id="s1">0</strong></article><article>Confirmadas<strong id="s2">0</strong></article><article>Personas<strong id="s3">0</strong></article><article>Alertas AI<strong id="s4">0</strong></article></div></section><section id="view-agenda" class="view"><h1>Agenda</h1><div id="appointments"></div></section><section id="view-people" class="view"><h1>Personas</h1><button id="newPerson">+ Agregar persona</button><div id="people"></div><div id="detail" hidden><h2 id="detailName"></h2><textarea id="note" placeholder="Nota privada de Alex"></textarea><button id="saveNote">Guardar nota</button><div id="notes"></div></div></section><section id="view-voc" class="view"><h1>Mapa vocacional</h1><select id="vocPerson"></select><label>Intereses<textarea id="interests"></textarea></label><label>Fortalezas<textarea id="strengths"></textarea></label><label>Valores<textarea id="values"></textarea></label><label>Materias favoritas<textarea id="subjects"></textarea></label><label>Carreras consideradas<textarea id="careers"></textarea></label><label>Plan de orientación<textarea id="plan"></textarea></label><label>Contexto permitido para IA<textarea id="aiContext"></textarea></label><button id="saveVoc">Guardar mapa</button></section><section id="view-ai" class="view"><h1>Reflexión AI</h1><select id="aiPerson"></select><textarea id="aiMessage" placeholder="Pregunta de prueba"></textarea><button id="sendAI">Probar respuesta</button><div id="aiReply"></div></section></div></main><div id="personModal" class="modal" hidden><div class="card"><button class="x" data-pclose>×</button><h2>Nueva persona</h2><form id="personForm"><label>Nombre<input name="full_name" required></label><div class="grid"><label>Edad<input name="age" type="number"></label><label>Teléfono<input name="phone"></label></div><label>Correo<input name="email" type="email"></label><label>Nombre tutor<input name="guardian_name"></label><div class="grid"><label>Teléfono tutor<input name="guardian_phone"></label><label>Correo tutor<input name="guardian_email" type="email"></label></div><button>Crear ficha</button></form></div></div><script src="/admin.js"></script></body></html>
